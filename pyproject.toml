[project]
name = "pocket-agent"
version = "0.1.0"
description = "用飞书远程遥控本地 Claude Code / opencode / Codex 编码 Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "alloevil" }]
keywords = ["feishu", "lark", "ai-agent", "claude-code", "opencode", "codex", "coding-agent"]

dependencies = [
    "websockets>=13.0",
    "aiohttp>=3.14.3",
    "lark-oapi>=1.3.0",
]

[project.scripts]
pocket-agent = "main:main"

[project.urls]
Homepage = "https://github.com/alloevil/pocket-agent"
Repository = "https://github.com/alloevil/pocket-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pocket_agent"]
# main.py 是顶层入口模块，一并打包，使 pocket-agent 命令可用
include = ["main.py"]
