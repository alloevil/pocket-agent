name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Compile check
        run: uv run python -m compileall -q pocket_agent main.py

      - name: Run tests
        # 未安装的 agent CLI（claude/opencode）相关的真实端到端测试会自动跳过；
        # 离线测试（协议解析、渲染、会话、启动等）在 CI 全量运行。
        run: uv run python tests/run_all.py
